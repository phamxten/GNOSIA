<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="GNOSIA · Pahami dulu. Baru ngoding. Belajar JavaScript lewat 4 fase: Pahami, Perkuat, Kuis, Uji.">
<title>GNOSIA</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<!-- Theme and motion intensity are applied before first paint (no flash). -->
<script>(function(){var d=document.documentElement,t=null,m=null;try{t=localStorage.getItem('gnosia-theme');m=localStorage.getItem('gnosia-motion')}catch(e){}if(!t||t==='system')t=matchMedia('(prefers-color-scheme: dark)').matches?'ink':'paper';if(!m)m=matchMedia('(prefers-reduced-motion: reduce)').matches?'off':'full';d.dataset.theme=t;d.dataset.motion=m})()</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
